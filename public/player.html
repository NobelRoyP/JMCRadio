<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen – JMC Radio</title>
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="listen">
  <div class="app">
    <aside class="side" id="side"></aside>
    <main class="main">
      <div class="topbar"><b>All episodes</b></div>
      <header class="ph">
        <div class="cov" style="--h:145"><span>J</span></div>
        <div><h1>All episodes</h1><p id="count">Tuning in…</p></div>
      </header>
      <div class="acts">
        <button class="big" id="bigplay" type="button" aria-label="Play latest episode">
          <svg class="i-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b3b3b3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search episodes" aria-label="Search episodes" autocomplete="off">
        </label>
        <div class="chips" role="group" aria-label="Sort episodes">
          <button class="chip" type="button" data-order="new" aria-pressed="true">Newest</button>
          <button class="chip" type="button" data-order="old" aria-pressed="false">Oldest</button>
        </div>
      </div>
      <section id="rows" class="rows" aria-live="polite"><div class="skel"></div><div class="skel"></div><div class="skel"></div></section>
    </main>
  </div>

  <div id="np" class="np" role="region" aria-label="Now playing">
    <div class="np-l"><div id="np-cov"></div><div><strong id="np-title"></strong><span id="np-creator"></span></div></div>
    <div class="np-c">
      <div class="ctl">
        <button class="ib" id="prev" type="button" aria-label="Previous episode"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ib" id="back" type="button" aria-label="Back 15 seconds">&minus;15</button>
        <button class="pp" id="toggle" type="button" aria-label="Play or pause">
          <svg class="i-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button class="ib" id="fwd" type="button" aria-label="Forward 15 seconds">+15</button>
        <button class="ib" id="next" type="button" aria-label="Next episode"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="prog"><span id="cur">0:00</span><input class="bar" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    </div>
    <div class="np-r">
      <button class="ib" id="speed" type="button" aria-label="Playback speed">1x</button>
      <input class="bar vol" id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <button class="ib" id="close" type="button" aria-label="Close player"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>

  <script src="app.js"></script>
  <script>
  (() => {
    const J = window.JMC, $ = s => document.querySelector(s);
    const list = $('#rows'), audio = $('#audio'), np = $('#np'), seek = $('#seek'), vol = $('#vol');
    const st = { eps: [], q: '', order: 'new', cur: null, sig: '', view: [] };
    const ICONS = '<svg class="i-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
    const msg = (h, p) => '<div class="state"><h3>' + h + '</h3>' + p + '</div>';
    const toggle = () => audio.paused ? audio.play() : audio.pause();
    const seekBy = n => { audio.currentTime = Math.max(0, audio.currentTime + n); };

    function render(first) {
      const n = st.eps.length;
      if (!n) { list.innerHTML = msg('No episodes yet', 'New episodes will appear here as soon as they are published.'); $('#count').textContent = 'Off air for now'; st.view = []; return; }
      $('#count').textContent = 'JMC Radio, ' + n + (n === 1 ? ' episode' : ' episodes');
      const q = st.q.trim().toLowerCase();
      const v = [...st.eps].sort((a, b) => new Date(a.date) - new Date(b.date))
        .filter(e => !q || [e.title, e.creator, e.description].some(x => String(x == null ? '' : x).toLowerCase().includes(q)));
      if (st.order === 'new') v.reverse();
      st.view = v;
      if (!v.length) { list.innerHTML = msg('No results for “' + J.esc(st.q) + '”', 'Check the spelling or try a different title or creator.'); return; }
      list.innerHTML = v.map(e => `
        <article class="row rv" data-id="${J.esc(e.id)}">
          ${J.cov(e.title)}
          <div>
            <h3>${J.esc(e.title)}</h3>
            ${e.description ? '<p class="desc">' + J.esc(e.description) + '</p>' : ''}
            <div class="meta"><span>${J.esc(J.day(e.date))}</span><span>${J.esc(e.creator)}</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></div>
          </div>
          <button class="pb" type="button" aria-label="Play ${J.esc(e.title)}">${ICONS}</button>
        </article>`).join('');
      J.reveal(list, !first);
      mark();
    }

    function mark() {
      list.querySelectorAll('.row').forEach(r => {
        const on = r.dataset.id === st.cur;
        r.classList.toggle('active', on);
        r.classList.toggle('playing', on && !audio.paused);
      });
      $('#toggle').classList.toggle('playing', !audio.paused);
      $('#bigplay').classList.toggle('playing', !audio.paused);
    }

    function play(id) {
      if (st.cur === String(id)) { toggle(); return; }
      const ep = st.eps.find(e => String(e.id) === String(id));
      if (!ep) return;
      st.cur = String(id);
      audio.src = '/uploads/' + encodeURIComponent(ep.filename);
      audio.play().catch(() => {});
      $('#np-cov').innerHTML = J.cov(ep.title);
      $('#np-title').textContent = ep.title;
      $('#np-creator').textContent = ep.creator || '';
      np.classList.add('show');
      document.body.classList.add('has-player');
      if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: ep.creator || 'JMC Radio', album: 'JMC Radio' });
      mark();
    }

    const step = d => { const i = st.view.findIndex(e => String(e.id) === st.cur), n = st.view[i + d]; if (n) play(n.id); };

    async function load() {
      try {
        const r = await fetch('/api/episodes');
        if (!r.ok) throw new Error(r.status);
        const data = await r.json(), sig = JSON.stringify(data), first = !st.sig;
        if (sig === st.sig) return;
        st.sig = sig; st.eps = data; render(first);
        const want = new URLSearchParams(location.search).get('id');
        if (first && want) { play(want); const row = list.querySelector('[data-id="' + CSS.escape(want) + '"]'); if (row) row.scrollIntoView({ block: 'center' }); }
      } catch (err) {
        if (!st.sig) { list.innerHTML = msg('Episodes did not load', 'Check your connection and reload the page. We will keep retrying.'); $('#count').textContent = 'Signal lost'; }
      }
    }

    function paint() {
      const d = audio.duration, p = d ? audio.currentTime / d : 0;
      seek.value = p * 1000; J.fill(seek);
      $('#cur').textContent = J.fmt(audio.currentTime);
      $('#dur').textContent = J.fmt(d);
    }

    // Controls
    $('#toggle').onclick = toggle;
    $('#bigplay').onclick = () => st.cur ? toggle() : st.view[0] && play(st.view[0].id);
    $('#back').onclick = () => seekBy(-15);
    $('#fwd').onclick = () => seekBy(15);
    $('#prev').onclick = () => audio.currentTime > 4 ? (audio.currentTime = 0) : step(-1);
    $('#next').onclick = () => step(1);
    vol.oninput = () => { audio.volume = vol.value; J.fill(vol); }; J.fill(vol);
    const speeds = [1, 1.25, 1.5, 2, 0.75]; let si = 0;
    $('#speed').onclick = e => { si = (si + 1) % speeds.length; audio.defaultPlaybackRate = audio.playbackRate = speeds[si]; e.currentTarget.textContent = speeds[si] + 'x'; };
    seek.oninput = () => { if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration; paint(); };
    $('#close').onclick = () => {
      audio.pause(); audio.removeAttribute('src'); audio.load();
      st.cur = null; np.classList.remove('show'); document.body.classList.remove('has-player'); mark(); paint();
    };
    ['play', 'pause'].forEach(ev => audio.addEventListener(ev, mark));
    ['timeupdate', 'loadedmetadata'].forEach(ev => audio.addEventListener(ev, paint));
    audio.addEventListener('ended', () => { mark(); step(1); });
    audio.addEventListener('error', () => { if (st.cur) $('#np-creator').textContent = 'This episode could not be loaded. Try another one.'; });
    if ('mediaSession' in navigator) {
      const ms = navigator.mediaSession;
      ms.setActionHandler('play', () => audio.play()); ms.setActionHandler('pause', () => audio.pause());
      ms.setActionHandler('seekbackward', () => seekBy(-15)); ms.setActionHandler('seekforward', () => seekBy(15));
      ms.setActionHandler('previoustrack', () => step(-1)); ms.setActionHandler('nexttrack', () => step(1));
    }

    // List
    list.addEventListener('click', e => { const r = e.target.closest('.row'); if (r) play(r.dataset.id); });
    $('#q').addEventListener('input', e => { st.q = e.target.value; render(); });
    document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      st.order = b.dataset.order;
      document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
      render();
    }));
    addEventListener('keydown', e => {
      if (!st.cur || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); toggle(); }
      if (e.key === 'ArrowLeft') seekBy(-15);
      if (e.key === 'ArrowRight') seekBy(15);
    });

    load();
    setInterval(load, 30000);
  })();
  </script>
</body>
</html>
